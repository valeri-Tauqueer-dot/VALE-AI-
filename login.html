<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VALE Login</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="login.css">

</head>

<body>

<header class="topbar">

<div class="brand">

<div class="vale-symbol">

<svg viewBox="0 0 120 120" fill="none">

<path d="M18 18L60 102L102 18"
stroke="#D4AF37"
stroke-width="6"/>

<path d="M36 44L60 82L84 44"
stroke="#00E5FF"
stroke-width="5"/>

</svg>

</div>

<div class="brand-name">

<h2>VALE</h2>

<span>AI TRADING</span>

</div>

</div>

</header>

<section class="login-page">

<div class="login-card">

<h1>Welcome Back</h1>

<p>Sign in to your VALE account</p>

<form id="loginForm">

<input
type="text"
id="username"
placeholder="Username"
required
>

<input
type="password"
id="password"
placeholder="Password"
required
>

<button type="submit">

Login

</button>

</form>

<p>

Don't have an account?

<a href="signup.html">

Create Account

</a>

</p>

</div>

</section>

  <link rel="stylesheet" href="vale-core-3d.css">

<script type="module" src="vale-core-3d.js"></script>

<script src="login.js"></script>

</body>

</html>
