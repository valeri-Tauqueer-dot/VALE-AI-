<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>VALE AI Login</title>

<meta
    name="description"
    content="VALE AI Trading — Intelligence Beyond Markets"
>


<!-- =========================================
     MAIN VALE DESIGN
     ========================================= -->

<link
    rel="stylesheet"
    href="style.css"
>


<!-- =========================================
     LOGIN DESIGN
     ========================================= -->

<link
    rel="stylesheet"
    href="login.css"
>


<!-- =========================================
     VALE 3D CORE DESIGN
     ========================================= -->

<link
    rel="stylesheet"
    href="vale-core-3d.css"
>


</head>


<body>


<!-- =========================================
     VALE HEADER
     ========================================= -->

<header class="topbar">

    <div class="brand">

        <div class="vale-symbol">

            <svg
                viewBox="0 0 120 120"
                fill="none"
            >

                <path
                    d="M18 18L60 102L102 18"
                    stroke="#D4AF37"
                    stroke-width="6"
                />

                <path
                    d="M36 44L60 82L84 44"
                    stroke="#00E5FF"
                    stroke-width="5"
                />

            </svg>

        </div>


        <div class="brand-name">

            <h2>VALE</h2>

            <span>AI TRADING</span>

        </div>

    </div>

</header>


<!-- =========================================
     LOGIN PAGE
     ========================================= -->

<section class="login-page">


    <div class="login-card">


        <h1>
            Welcome Back
        </h1>


        <p>
            Sign in to your VALE account
        </p>


        <!-- =================================
             LOGIN FORM
             ================================= -->

        <form id="loginForm">


            <input
                type="text"
                id="username"
                placeholder="Username"
                autocomplete="username"
                required
            >


            <input
                type="password"
                id="password"
                placeholder="Password"
                autocomplete="current-password"
                required
            >


            <button
                type="submit"
            >

                Login

            </button>


        </form>


        <p>

            Don't have an account?

            <a href="signup.html">
                Create Account
            </a>

        </p>


    </div>


</section>


<!-- =========================================
     VALE 3D CORE
     ========================================= -->

<script
    type="module"
    src="vale-core-3d.js"
></script>


<!-- =========================================
     START VALE 3D CORE
     ========================================= -->

<script>

window.addEventListener(
    "load",
    () => {

        setTimeout(
            () => {

                if (
                    window.VALECore
                ) {

                    window.VALECore.start();

                    window.VALECore.setStatus(
                        "AWAKENING VALE CORE"
                    );

                }

            },
            100
        );

    }
);

</script>


<!-- =========================================
     VALE LOGIN SYSTEM
     ========================================= -->

<script
    src="login.js"
></script>


</body>

</html>
